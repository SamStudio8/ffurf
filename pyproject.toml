[project]
name = "ffurf"
version = "0.3.0"
description = "Lightweight configuration library"
authors = [{ name = "Sam Nicholls", email = "sam@samnicholls.net" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["toml>=0.10.2"]

[project.optional-dependencies]
rich = ["rich>=12.0.0"]

[dependency-groups]
dev = ["pytest>=7.0.0", "black>=22.1.0", "pre-commit>=2.17.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffurf"]
